services:
  - type: web
    name: xinhuo-renyi
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python tools/server.py"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: PYTHONUNBUFFERED
        value: "1"
